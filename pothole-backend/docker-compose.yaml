services:

  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:16-0.107.0-ferretdb-2.7.0
    container_name: pothole-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: pothole
      POSTGRES_PASSWORD: pothole_dev_password
      POSTGRES_DB: postgres

    volumes:
      - pothole_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pothole -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.7.0
    container_name: pothole-ferretdb
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      FERRETDB_POSTGRESQL_URL: postgres://pothole:pothole_dev_password@postgres:5432/postgres

    ports:
      - "27018:27017"


  backend:
    build: .
    container_name: pothole-backend
    restart: unless-stopped

    depends_on:
      ferretdb:
        condition: service_healthy

    environment:
      PORT: 10000
      MONGO_URI: mongodb://pothole:pothole_dev_password@ferretdb:27017/postgres
      JWT_SECRET: test-secret-for-docker

    ports:
      - "5001:10000"


volumes:
  pothole_postgres_data: